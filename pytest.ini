# =========================================================
# MEDISCOPE Pytest Configuration
#
# Purpose:
#     Configure test discovery and Python import paths for
#     both the MEDISCOPE API and machine-learning packages.
#
# Project import roots:
#     .    -> exposes the root-level `src` ML package
#     api  -> exposes the FastAPI `app` package
#
# Test suites:
#     tests/     -> machine-learning and inference tests
#     api/tests/ -> backend API and security tests
# =========================================================

[pytest]

# ---------------------------------------------------------
# Python import paths
# ---------------------------------------------------------

pythonpath =
    .
    api

# ---------------------------------------------------------
# Test discovery
# ---------------------------------------------------------

testpaths =
    tests
    api/tests

# ---------------------------------------------------------
# Standard pytest reporting
# ---------------------------------------------------------

addopts = -ra

# ---------------------------------------------------------
# Keep pytest's cache at the repository root.
# The directory should remain excluded through .gitignore.
# ---------------------------------------------------------

cache_dir = .pytest_cache
