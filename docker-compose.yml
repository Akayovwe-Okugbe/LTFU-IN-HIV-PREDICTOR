services:
  postgres:
    image: postgres:17
    container_name: mediscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediscope
      POSTGRES_USER: mediscope
      POSTGRES_PASSWORD: replace-me
    ports:
      - "5432:5432"
    volumes:
      - mediscope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscope -d mediscope"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mediscope_postgres_data:
